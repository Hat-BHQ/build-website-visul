name: Build images
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: hq-portal-web
            context: apps/portal-web
          - name: hq-portal-bff
            context: apps/portal-bff
          - name: hq-identity-service
            context: services/identity-service
          - name: hq-hqa-service
            context: services/hqa-service
          - name: hq-sync-service
            context: services/sync-service
          - name: hq-hqs-service
            context: services/hqs-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest

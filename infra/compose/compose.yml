services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      IDENTITY_DB: ${IDENTITY_DB}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      HQA_DB: ${HQA_DB}
      HQA_DB_USER: ${HQA_DB_USER}
      HQA_DB_PASSWORD: ${HQA_DB_PASSWORD}
      SYNC_DB: ${SYNC_DB}
      SYNC_DB_USER: ${SYNC_DB_USER}
      SYNC_DB_PASSWORD: ${SYNC_DB_PASSWORD}
      HQS_DB: ${HQS_DB}
      HQS_DB_USER: ${HQS_DB_USER}
      HQS_DB_PASSWORD: ${HQS_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    networks: [backend]

  identity-service:
    build: ../../services/identity-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${IDENTITY_DB_USER}:${IDENTITY_DB_PASSWORD}@postgres:5432/${IDENTITY_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD}
      BOOTSTRAP_HQA_ADMIN_EMAIL: ${BOOTSTRAP_HQA_ADMIN_EMAIL}
      BOOTSTRAP_HQA_ADMIN_PASSWORD: ${BOOTSTRAP_HQA_ADMIN_PASSWORD}
      BOOTSTRAP_HQA_USER_EMAIL: ${BOOTSTRAP_HQA_USER_EMAIL}
      BOOTSTRAP_HQA_USER_PASSWORD: ${BOOTSTRAP_HQA_USER_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  hqa-service:
    build: ../../services/hqa-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${HQA_DB_USER}:${HQA_DB_PASSWORD}@postgres:5432/${HQA_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  hqs-service:
    build: ../../services/hqs-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${HQS_DB_USER}:${HQS_DB_PASSWORD}@postgres:5432/${HQS_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  sync-api:
    build: ../../services/sync-service
    restart: unless-stopped
    environment: &sync-environment
      DATABASE_URL: postgresql+psycopg://${SYNC_DB_USER}:${SYNC_DB_PASSWORD}@postgres:5432/${SYNC_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      HQA_SERVICE_URL: http://hqa-service:8000
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      hqa-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  sync-worker:
    build: ../../services/sync-service
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *sync-environment
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      hqa-service: { condition: service_healthy }
    networks: [backend]

  portal-bff:
    build: ../../apps/portal-bff
    restart: unless-stopped
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8000
      HQA_SERVICE_URL: http://hqa-service:8000
      SYNC_SERVICE_URL: http://sync-api:8000
      HQS_SERVICE_URL: http://hqs-service:8000
      COOKIE_NAME: ${COOKIE_NAME}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      identity-service: { condition: service_healthy }
      hqa-service: { condition: service_healthy }
      sync-api: { condition: service_healthy }
      hqs-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  portal-web:
    build: ../../apps/portal-web
    restart: unless-stopped
    networks: [frontend]

  edge-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      portal-web: { condition: service_started }
      portal-bff: { condition: service_healthy }
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
